<html><head><style>
@font-face{font-family:DMS;src:url(dmserif.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse at 30% 30%,#22307a 0%,#121a4a 55%,#090d2b 100%);font-family:Inter;color:#fff;position:relative}
.l{position:absolute;left:64px;top:70px;width:600px}
.brand{display:flex;align-items:center;gap:14px;font-family:DMS;font-size:36px}
.mark{width:56px;height:56px;border-radius:14px;background:#f1f5ff;color:#1e293b;display:flex;align-items:center;justify-content:center}
.mark svg{width:34px;height:34px}
h1{font-family:DMS;font-weight:400;font-size:88px;line-height:1.0;margin-top:44px;letter-spacing:-.01em}
h1 span{color:#ffd166}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;width:560px}
.chip{font-weight:700;font-size:24px;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25)}
.chip.y{background:#7b5cff;border-color:#7b5cff}
.shot{position:absolute;left:640px;top:96px;width:760px;border-radius:18px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55);transform:perspective(1600px) rotateY(-14deg) rotateX(4deg);border:3px solid rgba(255,255,255,.35)}
.shot img{display:block;width:100%}
.play{position:absolute;left:880px;top:520px;width:110px;height:110px;border-radius:50%;background:#ff5d8f;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(255,93,143,.6)}
.play:after{content:'';border-left:38px solid #fff;border-top:24px solid transparent;border-bottom:24px solid transparent;margin-left:10px}
.url{position:absolute;left:64px;bottom:44px;font-family:'JetBrains Mono';font-weight:700;font-size:26px;color:#c7cdea}
</style></head><body>
<div class="l"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></div>Depotex</div>
<h1>Every package.<br><span>One server.</span></h1>
<div class="chips"><div class="chip">18 formats</div><div class="chip">Quarantine</div><div class="chip">SBOMs</div><div class="chip y">AI-ready (MCP)</div></div></div>
<div class="shot"><img src="dashboard-overview.png"></div><div class="play"></div>
<div class="url">vectored.dev</div>
</body></html>
