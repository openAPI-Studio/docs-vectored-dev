<!DOCTYPE html>
<!-- BLOG POST TEMPLATE
     1. Copy this file to blog/posts/<your-slug>.html
     2. Replace TITLE, DATE (YYYY-MM-DD), TAG, DESCRIPTION and the article body.
     3. Add an entry for it at the top of assets/blog-index.js (same slug).
     Note: this file lives one level ABOVE posts/, so after copying into
     posts/ the ../../ paths below are already correct. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITLE — Vectored Blog</title>
  <meta name="description" content="DESCRIPTION">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
    var light=t?t==='light':window.matchMedia('(prefers-color-scheme:light)').matches;
    var d=document.documentElement;d.dataset.theme=light?'light':'dark';
    d.classList.toggle('dark',!light);d.classList.toggle('light',light);})();</script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../assets/tailwind-config.js"></script>
  <link rel="stylesheet" href="../../assets/tokens.css">
  <style>
    .prose-vc h2{font-size:1.375rem;font-weight:700;margin:2.25rem 0 0.75rem}
    .prose-vc h3{font-size:1.125rem;font-weight:600;margin:1.75rem 0 0.5rem}
    .prose-vc p{margin:0.75rem 0;line-height:1.75;color:var(--body)}
    .prose-vc ul{list-style:disc;margin:0.75rem 0 0.75rem 1.5rem;color:var(--body);line-height:1.7}
    .prose-vc a{color:var(--green)}
    .prose-vc code{font-family:'JetBrains Mono',monospace;font-size:0.85em;background:var(--surface);border:1px solid var(--border);padding:0.1em 0.35em;border-radius:4px}
    .prose-vc img{border-radius:0.75rem;border:1px solid var(--border);margin:1.5rem 0;max-width:100%}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body class="min-h-screen flex flex-col">

<div id="vc-header"></div>
<script src="../../assets/nav.js"></script>
<script src="../../assets/header.js"></script>

  <main class="flex-1 px-4 sm:px-6 lg:px-8 py-16 max-w-3xl mx-auto w-full">
    <a href="../" class="text-sm text-muted hover:text-cta transition-colors duration-200 cursor-pointer">&larr; All posts</a>
    <div class="flex items-center gap-3 text-xs text-muted mt-6 mb-3">
      <span class="font-mono text-cta bg-cta/10 border border-cta/30 rounded-full px-2.5 py-0.5">TAG</span>
      <time datetime="DATE">DATE</time>
    </div>
    <h1 class="text-3xl sm:text-4xl font-bold leading-tight mb-8">TITLE</h1>

    <article class="prose-vc">
      <p>Intro paragraph…</p>
      <h2>Section</h2>
      <p>Body…</p>
    </article>
  </main>

<div id="vc-footer"></div>
<script src="../../assets/footer.js"></script>
</body>
</html>
